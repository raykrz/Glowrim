name: Windows build

on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - run: npm ci

      - name: Build the installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Glowrim-Windows
          path: windows/dist/Glowrim-Setup-*.exe

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Glowrim for Windows ${TAG#windows-v} (beta)" --prerelease \
            --notes "Windows beta of Glowrim. See the README for install steps and known limits."
          gh release upload "$TAG" Glowrim-Setup-*.exe --clobber
