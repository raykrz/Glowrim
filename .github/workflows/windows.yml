name: Windows build

on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - run: npm ci

      - name: Build the installer
        run: npm run dist

      - name: Smoke test the packaged app (demo input)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:GLOWRIM_SELFTEST_DIR = "$PWD/selftest-demo"
          Start-Process -FilePath "dist/win-unpacked/Glowrim.exe" -ArgumentList "--demo","--selftest" -Wait
          if (-not (Test-Path selftest-demo/selftest.json)) { throw "app did not produce a self-test report" }
          Get-Content selftest-demo/selftest.json
          $r = Get-Content selftest-demo/selftest.json | ConvertFrom-Json
          if ($r.overlays -lt 1) { throw "no overlay window was created" }

      - name: Smoke test the packaged app (real audio capture path)
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true   # hosted runners have no sound device, so this only reports what happens
        run: |
          $env:GLOWRIM_SELFTEST_DIR = "$PWD/selftest-live"
          Start-Process -FilePath "dist/win-unpacked/Glowrim.exe" -ArgumentList "--selftest" -Wait
          if (Test-Path selftest-live/selftest.json) { Get-Content selftest-live/selftest.json }

      - uses: actions/upload-artifact@v4
        with:
          name: Glowrim-Windows
          path: windows/dist/Glowrim-Setup-*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            windows/selftest-demo
            windows/selftest-live
          if-no-files-found: ignore

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Glowrim for Windows ${TAG#windows-v} (beta)" --prerelease \
            --notes "Windows beta of Glowrim. See the README for install steps and known limits."
          gh release upload "$TAG" Glowrim-Setup-*.exe --clobber
